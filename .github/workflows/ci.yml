name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start the Atlas Local image through Testcontainers.
      - run: mvn -B verify
        working-directory: Backend

  ai:
    name: AI service and ingestion (pytest)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.0
        ports:
          - 27018:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: AI
      - run: python -m pytest
        working-directory: AI
        env:
          TEST_MONGODB_URI: mongodb://localhost:27018/?directConnection=true

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Docker images
    needs: [backend, ai]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t yojnasetu-backend Backend
      - run: docker build -t yojnasetu-ai AI

  deploy:
    name: Trigger Render deploy
    needs: [backend, ai, frontend, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Deploy hook URLs are secrets. Until they exist, the job reports that and succeeds.
      # The frontend deploys through Vercel's Git integration on the same push.
      - name: Call deploy hooks
        env:
          AI_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_AI }}
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$AI_HOOK" ] || [ -z "$BACKEND_HOOK" ]; then
            echo "Render deploy hooks are not configured; skipping deployment."
            exit 0
          fi
          curl -fsS -X POST "$AI_HOOK" > /dev/null
          curl -fsS -X POST "$BACKEND_HOOK" > /dev/null
          echo "Render deployments triggered."
