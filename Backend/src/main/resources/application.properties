spring.application.name=yojnasetu-backend
# Local development reads the repo-root .env; real environment variables take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:yojnasetu}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service-token=${AI_SERVICE_TOKEN:}
